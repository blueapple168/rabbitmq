name: RabbitMQ UOS 镜像构建
# 适用仓库结构: <版本>/UOS/{Dockerfile, docker-entrypoint.sh, conf.d/...}
# 例如: https://github.com/blueapple168/rabbitmq/tree/master/4.3/UOS
#
# 功能:
#   1. detect    : 自动检测本次提交涉及的 */UOS 变体版本目录 (如 4.3)
#   2. build-push: push 到 master 或手动触发时，推送镜像到 ghcr.io
#
# 产物 tag 以版本目录名为准并带 -management 后缀 (镜像自带管理控制台插件):
#   ghcr.io/blueapple168/rabbitmq:4.3-management
# 并额外打上 Dockerfile 中 ARG RABBITMQ_VERSION 的完整版本号 tag (如 4.3.6-management)
on:
  push:
    branches: [master]
    paths:
      - "**/UOS/**"
      - ".github/workflows/docker-build-rabbitmq-uos.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/UOS/**"
      - ".github/workflows/docker-build-rabbitmq-uos.yml"
  workflow_dispatch:
    inputs:
      version_dir:
        description: "要构建的版本目录名 (如 4.3; 留空则构建仓库中所有 */UOS 变体)"
        required: false
        default: ""
env:
  REGISTRY: ghcr.io
  # 构建平台; 如需 arm64 改为 "linux/amd64,linux/arm64"
  # (前提: GHCR 上已推送对应架构的 UOS 基础镜像 uos-server-20-1070a)
  PLATFORMS: linux/amd64
concurrency:
  group: rabbitmq-uos-${{ github.ref }}
  cancel-in-progress: true
# GITHUB_TOKEN 默认只读; 需要推送镜像的 job 单独提权 packages: write
permissions:
  contents: read
jobs:
  ############################################
  # 检测本次变更涉及的版本目录 (4.3 / 4.4 / ...; 无 UOS 变更则跳过后续构建)
  ############################################
  detect:
    name: 检测待构建版本
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 计算变更涉及的版本目录
        id: set
        run: |
          set -eux
          files=""
          case "${{ github.event_name }}" in
            pull_request)
              git fetch origin "${{ github.base_ref }}"
              files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
              ;;
            push)
              files=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
              ;;
          esac
          # 取不到 diff (手动触发 / 新建分支首推 / 重跑) 时的兜底:
          #   指定了 version_dir -> 只构建该版本; 否则构建仓库中全部 */UOS 变体
          if [ -z "$files" ] && [ -n "${{ github.event.inputs.version_dir }}" ]; then
            files="${{ github.event.inputs.version_dir }}/UOS/Dockerfile"
          fi
          if [ -z "$files" ]; then
            files=$(find . -mindepth 3 -maxdepth 3 -path './*/UOS/Dockerfile' | sed 's|^\./||')
          fi
          # 取路径首段 (版本目录名)，过滤掉 .github 等非版本目录
          versions=$(printf '%s\n' "$files" | cut -d/ -f1 | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -u || true)
          # 仅保留实际存在 <版本>/UOS/Dockerfile 的目录 (防止 workflow_dispatch 手输错版本)
          declare -a valid_versions=()
          while IFS= read -r v; do
            if [[ -n "${v}" && -f "${v}/UOS/Dockerfile" ]]; then
              valid_versions+=("${v}")
            fi
          done < <(printf '%s\n' "${versions}")
          versions=$(printf '%s\n' "${valid_versions[@]}" | sort -u)
          if [ -z "$versions" ]; then
            echo "::notice::本次变更未涉及任何 */UOS 目录，跳过构建"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix=$(printf '%s\n' "$versions" | jq -Rsc 'split("\n") | map(select(length > 0)) | map({version: .})')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "待构建版本: $(echo "$versions" | tr '\n' ' ')"
  ############################################
  # 构建并推送镜像 (push 到 master 或手动触发)
  ############################################
  build-push:
    name: "推送镜像 (${{ matrix.version }}/UOS)"
    needs: [detect]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      BUILD_DIR: ${{ matrix.version }}/UOS
    steps:
      - uses: actions/checkout@v4
      - name: 设置 QEMU (仅多架构时需要)
        if: contains(env.PLATFORMS, 'arm')
        uses: docker/setup-qemu-action@v3
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算镜像名称与 tag
        id: meta
        run: |
          set -eux
          VERSION_DIR="${{ matrix.version }}"
          # 完整版本号取自 Dockerfile 的 ARG RABBITMQ_VERSION (如 4.3.6)
          FULL_VERSION="$(grep -m1 -E '^ARG RABBITMQ_VERSION=' "${{ env.BUILD_DIR }}/Dockerfile" | cut -d= -f2)"
          test -n "$FULL_VERSION"
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${REPO}"
          # 镜像自带 rabbitmq_management 管理控制台插件，tag 统一带 -management 后缀
          {
            echo "image=${IMAGE}"
            echo "tags=${IMAGE}:${VERSION_DIR}-management,${IMAGE}:${FULL_VERSION}-management"
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_DIR }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=rabbitmq-${{ matrix.version }}-uos
          cache-to: type=gha,scope=rabbitmq-${{ matrix.version }}-uos,mode=max
      - name: 汇总输出
        run: |
          {
            echo "### 已推送镜像 (${{ matrix.version }}/UOS)"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
